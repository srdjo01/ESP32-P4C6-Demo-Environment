dependencies:
  idf: ">=5.3.0"
  espressif/esp_tinyusb: ">=1.0.0"
  # Wi-Fi/BLE on the ESP32-P4 is provided by the companion ESP32-C6 over SDIO.
  # esp_wifi_remote transparently forwards esp_wifi API calls to the C6 via
  # ESP-Hosted, so the existing wifi_module.c (esp_wifi_*) works unchanged.
  espressif/esp_wifi_remote: "~0.5.0"
  espressif/esp_hosted: "*"
